<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Spooky Cat Cafe</title>
        <link rel = "stylesheet" href = "style.css" />
    </head>
    <body>
        <main class ="game">
            <!-- Top Bar -->
             <header class = "top-bar">
                <h1>Spooky Cat Cafe</h1>
                <div class="stats">
                    <span>
                        TIME:
                        <b id="timer">60</b>
                    </span>

                    <span>
                        COINS:
                        <b id="coins">0</b>
                    </span>
                </div>
             </header>

            <!-- Start Screen -->
             <section id="start-screen" class="screen">
                <img class="cafe-shop" src="assets/cafe-shop.png" alt="Cafe Shop Image" />
                <h2> Welcome to Spooky Cat Cafe! </h2>
                <button id="start-button">Start Shift</button>
             </section>

             <!-- Game Screen -->
             <section id="game-screen">
                <div class="cafe-scene">
                    <!-- Customer -->
                     <section class="customer-area">
                        <div class="customer">
                            <img id="customer-image" src="assets/vampire-customer.gif" alt="Customer"/>
                        </div>

                        <div class="order-ticket">
                            <img class="order-bubble" src="assets/bubble.png" alt="" />
                            <div class="order-content">
                                <div id="order-text"></div>
                            </div>
                        </div>
                     </section>

                     <section class="workbench">
                        <div class="workbench-content">
                            <!-- Ice -->
                             <div class="station ice-station">
                                <button class="art-button" data-type="ice" data-value="yes" aria-label="Add or remove ice">
                                    <img src="assets/ice-scoop.png" alt="Ice scoop" />
                                </button>
                             </div>
                            <!-- Drink Bases -->
                             <div class="station base-station">
                                <button class="art-button" data-type="base" data-value="coffee" aria-label="Add Coffee">
                                    <img src="assets/coffee-station.gif" alt="Coffee" />
                                </button>
                                <button class="art-button" data-type="base" data-value="cider" aria-label="Add Cider">
                                    <img src="assets/apple-cider-station.gif" alt="Cider" />
                                </button>
                                <button class="art-button" data-type="base" data-value="chocolate" aria-label="Add Chocolate">
                                    <img src="assets/hot-chocolate-station.gif" alt="Chocolate" />
                                </button>
                             </div>
                            <!-- Syrups -->
                             <div class="station syrup-station">
                                <button class="art-button" data-type="syrup" data-value="pumpkin" aria-label="Pumpkin syrup">
                                    <img src="assets/pumpkin-syrup-bottle.gif" alt="Pumpkin syrup" />
                                </button>
                                <button class="art-button" data-type="syrup" data-value="caramel" aria-label="Caramel syrup">
                                    <img src="assets/caramel-syrup-bottle.gif" alt="Caramel syrup" />
                                </button>
                                <button class="art-button" data-type="syrup" data-value="cider" aria-label="Cider syrup">
                                    <img src="assets/cider-syrup-bottle.gif" alt="Cider bottle" />
                                </button>
                                <button class="art-button" data-type="syrup" data-value="chocolate" aria-label="Chocolate syrup">
                                    <img src="assets/chocolate-syrup-bottle.gif" alt="Chocolate syrup" />
                                </button>
                             </div>
                            <!-- Toppings -->
                             <div class="station topping-station">
                                <button class="art-button" data-type="topping" data-value="cinnamon" aria-label="Cinnamon topping">
                                    <img src="assets/cinnamon-container.png" alt="Cinnamon topping" />
                                </button>
                                <button class="art-button" data-type="topping" data-value="whipped" aria-label="Whipped cream">
                                    <img src="assets/whipped-cream-container.png" alt="Whipped cream container" />
                                </button>
                                <button class="art-button" data-type="topping" data-value="marshmallows" aria-label="Marshmallows container">
                                    <img src="assets/marshmallow-bowl.png" alt="Marshmallows container" />
                                </button>
                                <button class="art-button" data-type="topping" data-value="sprinkles" aria-label="Sprinkles container">
                                    <img src="assets/sprinkles-container.png" alt="Sprinkles container" />
                                </button>
                                <!-- Cup -->
                                 <div class="cup-station">
                                    <img class="cup-outline" src="assets/clear-cup.png" alt="Clear cup" />
                                    <img id="cup-ice" class="cup layer" src="assets/ice.png" alt="Ice" hidden />
                                    
                                    <img id="cup-base" class="cup layer" alt="" hidden />
                                    <img id="cup-syrup" class="cup layer" alt="" hidden />
                                    <div id="cup-toppings" class="cup-toppings"></div>
                                 </div>

                                 <div class="cup-actions">
                                    <button id="clear-button" class="trash-button" aria-label="Clear cup" title="clear cup">
                                        <img src="assets/bin.png" alt="" />
                                    </button>

                                    <button id="serve-button">SERVE DRINK</button>
                                 </div>
                             </div>
                        </div>
                     </section>

                </div>
             </section>
        </main>
    </body>
</html>
