<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Spooky Cat Cafe</title>
        <link rel = "stylesheet" href = "style.css" />
    </head>
    <body>
        <main class ="game">
            <!-- Top Bar -->
             <header class = "top-bar">
                <h1>Spooky Cat Cafe</h1>
                <div class="stats">
                    <span>
                        TIME:
                        <b id="timer">60</b>
                    </span>

                    <span>
                        COINS:
                        <b id="coins">0</b>
                    </span>
                </div>
             </header>

            <!-- Start Screen -->
             <section id="start-screen" class="screen">
                <img class="cafe-shop" src="assets/cafe-shop.png" alt="Cafe Shop Image" />
                <h2> Welcome to Spooky Cat Cafe! </h2>
                <button id="start-button">Start Shift</button>
             </section>

             <!-- Game Screen -->
             <section id="game-screen" hidden>
                <div class="cafe-scene">
                    <!-- Customer -->
                     <section class="customer-area">
                        <div class="customer">
                            <img id="customer-image" src="assets/vampire-customer.gif" alt="Customer"/>
                        </div>

                        <div class="order-ticket">
                            <img class="order-bubble" src="assets/bubble.png" alt="" />"
                            <div class="order-content">
                                <div id="order-text"></div>"
                            </div>
                        </div>
                     </section>

                     <section class="workbench">
                        <div class="workbench-content">
                            <!-- Ice -->
                             <div class="station ice-station">
                                <button class="art-button" data-type="ice" data-value="yes" aria-label="Add or remove ice">
                                    <img src="assets/ice-scoop.png" alt="Ice scoop" />
                                </button>
                             </div>
                            <!-- Drink Bases -->
                            <!-- Syrups -->
                            <!-- Toppings -->
                        </div>
                     </section>

                </div>
             </section>
        </main>
    </body>
</html>
