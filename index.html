<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Spooky Cat Cafe</title>
        <link rel = "stylesheet" href = "style.css" />
    </head>
    <body>
        <main class ="game">
            <!-- Top Bar -->
             <header class = "top-bar">
                <h1>Spooky Cat Cafe</h1>
                <div class="stats">
                    <span>
                        TIME:
                        <b id="timer">60</b>
                    </span>

                    <span>
                        COINS:
                        <b id="coins">0</b>
                    </span>
                </div>
             </header>

            <!-- Start Screen -->
             <section id="start-screen" class="screen">
                <img class="cafe-shop" src="assets/cafe-shop.png" alt="Cafe Shop Image" />
             </section>
        </main>
    </body>
</html>
